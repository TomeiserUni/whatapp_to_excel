name: Build Windows EXE

on:
  push:
    tags: ["v*"]          # dispara ao criar tag: git tag v1.0 && git push --tags
  workflow_dispatch:       # ou manualmente no GitHub → Actions → Run workflow

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PyTorch CPU
        run: |
          pip install torch==2.0.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Pré-descarregar modelos EasyOCR
        run: python -c "import easyocr; easyocr.Reader(['pt'], gpu=False)"

      - name: Build com PyInstaller
        run: pyinstaller app.spec

      - name: Compactar resultado
        run: |
          Compress-Archive -Path dist\WhatsAppExcel -DestinationPath WhatsAppExcel-windows.zip

      - name: Upload artefacto
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppExcel-windows
          path: WhatsAppExcel-windows.zip
          retention-days: 30
