name: Build Windows Installer

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          pip install torch==2.0.1+cpu --extra-index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe
        run: pyinstaller build/app.spec

      - name: Criar instalador (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" build\installer.iss

      - name: Upload instalador
        uses: actions/upload-artifact@v4
        with:
          name: WhatsAppExcel-Instalador
          path: dist\WhatsAppExcel_Instalador.exe
          retention-days: 30
