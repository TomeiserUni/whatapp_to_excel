<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WhatsApp → Excel</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; flex-direction: column; }

  header { background: #16213e; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #0f3460; }
  header h1 { font-size: 1.2rem; color: #4fc3f7; font-weight: 600; }
  #status-bar { font-size: 0.85rem; display: flex; align-items: center; gap: 8px; }
  #settings-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200; align-items: center; justify-content: center; }
  #settings-modal.visible { display: flex; }
  #settings-box { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 24px; width: 420px; max-width: 90vw; }
  #settings-box h3 { color: #4fc3f7; margin-bottom: 16px; font-size: 1rem; }
  #settings-box label { font-size: .85rem; color: #90caf9; display: block; margin-bottom: 6px; }
  .key-row { display: flex; gap: 8px; }
  .key-row input { flex: 1; padding: 8px 12px; background: #0f3460; border: 1px solid #1565c0; border-radius: 7px; color: #e0e0e0; font-size: .88rem; }
  #key-status { font-size: .8rem; margin-top: 8px; min-height: 18px; }
  .settings-actions { display: flex; gap: 8px; margin-top: 16px; justify-content: flex-end; }
  .alias-tab { background: none; border: none; color: #90caf9; padding: 8px 14px; font-size: .85rem; cursor: pointer; border-bottom: 2px solid transparent; }
  .alias-tab.active { color: #4fc3f7; border-bottom-color: #4fc3f7; font-weight: 600; }
  .alias-item { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; padding: 9px 10px; border-radius: 7px; background: #0f3460; margin-bottom: 6px; }
  .alias-item .expr { color: #e0e0e0; font-weight: 600; font-size: .88rem; }
  .alias-item .prods { color: #90caf9; font-size: .8rem; margin-top: 2px; }
  .alias-item .prods .ref { color: #546e7a; }
  .alias-item .inexistente { color: #ef9a9a; font-size: .8rem; font-style: italic; }
  .alias-del { background: #4e2a2a; color: #ef9a9a; border: none; border-radius: 6px; padding: 4px 9px; font-size: .78rem; cursor: pointer; flex-shrink: 0; }
  .alias-del:hover { background: #6d3a3a; }
  .alias-chip { background: #1565c0; color: #fff; border-radius: 14px; padding: 3px 10px; font-size: .8rem; display: inline-flex; align-items: center; gap: 6px; }
  .alias-chip button { background: none; border: none; color: #bbdefb; cursor: pointer; font-size: .95rem; line-height: 1; padding: 0; }
  #alias-pesquisa-res div { padding: 7px 10px; cursor: pointer; border-radius: 6px; font-size: .85rem; color: #e0e0e0; }
  #alias-pesquisa-res div:hover { background: #0f3460; }
  #alias-pesquisa-res .ref { color: #546e7a; font-size: .78rem; }
  #alias-vazio { color: #546e7a; font-size: .85rem; text-align: center; padding: 20px; }
  #status-dot { width: 10px; height: 10px; border-radius: 50%; background: #ffa726; animation: pulse 1s infinite; }
  #status-dot.ready { background: #66bb6a; animation: none; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  main { flex: 1; display: flex; gap: 16px; padding: 16px; max-width: 1200px; width: 100%; margin: 0 auto; }

  /* drop zone */
  #zona-imagem { display: flex; flex-direction: column; flex: 1; gap: 12px; }
  #drop-zone { border: 2px dashed #4fc3f7; border-radius: 12px; padding: 40px 20px; text-align: center; cursor: pointer; transition: background .2s, border-color .2s; background: #0f3460; min-width: 260px; flex: 1; min-height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #drop-zone:hover, #drop-zone.drag-over { background: #1a4a80; border-color: #81d4fa; }
  #drop-zone svg { opacity: .6; margin-bottom: 12px; }
  #drop-zone p { color: #90caf9; font-size: 0.9rem; line-height: 1.6; }
  #file-input { display: none; }

  /* text area */
  #texto-area { margin-top: 12px; display: flex; flex-direction: column; flex: 1; }
  #texto-area textarea { width: 100%; flex: 1; min-height: 320px; background: #0f3460; border: 1px solid #1565c0; border-radius: 8px; color: #e0e0e0; padding: 10px; font-size: 0.9rem; resize: vertical; }
  .texto-actions { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin-top: 6px; }
  .texto-actions button { width: 100%; white-space: nowrap; }

  /* mode toggle */
  #mode-toggle { display: flex; gap: 6px; background: #0f3460; padding: 4px; border-radius: 10px; }
  #mode-toggle button { flex: 1; padding: 8px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.85rem; background: transparent; color: #90caf9; transition: background .15s, color .15s; }
  #mode-toggle button.active { background: #1565c0; color: #fff; }
  .modo-oculto { display: none !important; }

  /* left panel */
  #left { display: flex; flex-direction: column; gap: 12px; width: 340px; flex-shrink: 0; }
  #file-list { background: #0f3460; border-radius: 8px; padding: 8px; overflow-y: auto; max-height: 180px; flex-shrink: 0; }
  #file-list:empty { display: none; }
  .file-item { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 6px; font-size: 0.82rem; }
  .file-item .icon { font-size: 1rem; }

  /* results */
  #right { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  #table-wrap { flex: 1; overflow-y: auto; border-radius: 10px; background: #0f3460; }
  table { width: 100%; border-collapse: collapse; font-size: 0.87rem; }
  thead th { background: #16213e; color: #4fc3f7; padding: 10px 12px; text-align: left; position: sticky; top: 0; }
  tbody tr:hover { background: rgba(255,255,255,.04); }
  tbody td { padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .qtd-cell { cursor: text; border-radius: 4px; }
  .qtd-cell:hover { background: rgba(21,101,192,.25); }
  .qtd-cell:focus { outline: 1px solid #1565c0; background: #0f3460; }
  .score-high { color: #66bb6a; }
  .score-mid  { color: #ffa726; }
  .score-low  { color: #ef5350; }
  .btn-corrigir { padding: 4px 12px; font-size: .78rem; background: #37474f; color: #b3e5fc; border-radius: 6px; }
  .btn-corrigir:hover { background: #455a64; }
  .btn-inexistente { background: #4e342e; color: #ffab91; }
  .btn-inexistente:hover { background: #5d4037; }
  .corr-box { display: flex; gap: 6px; align-items: center; }
  .corr-box input { flex: 1; padding: 6px 10px; background: #0f3460; border: 1px solid #1565c0; border-radius: 6px; color: #e0e0e0; font-size: .82rem; }
  .corr-list { position: absolute; z-index: 30; background: #16213e; border: 1px solid #1565c0; border-radius: 6px; max-height: 220px; overflow-y: auto; min-width: 320px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
  .corr-list div { padding: 6px 12px; cursor: pointer; font-size: .82rem; }
  .corr-list div:hover { background: #1565c0; }
  .corr-list .ref { color: #607d8b; font-size: .72rem; }
  .corr-confirm { display: flex; gap: 10px; align-items: center; margin-top: 8px; flex-wrap: wrap; }
  .corr-confirm .corr-prod { font-size: .85rem; color: #b3e5fc; }
  .corr-confirm .ref { color: #607d8b; font-size: .72rem; }
  .corr-qtd-lbl { font-size: .8rem; color: #9e9e9e; display: flex; align-items: center; gap: 5px; }
  .corr-qtd { width: 64px; padding: 5px 8px; background: #0f3460; border: 1px solid #1565c0; border-radius: 6px; color: #e0e0e0; font-size: .85rem; }
  .btn-confirmar { padding: 6px 16px; }
  .btn-voltar { background: #37474f; color: #b3e5fc; }

  /* bottom */
  footer { background: #16213e; padding: 12px 24px; display: flex; gap: 10px; align-items: center; border-top: 1px solid #0f3460; }

  button { padding: 8px 18px; border: none; border-radius: 7px; cursor: pointer; font-size: 0.88rem; font-weight: 500; transition: background .15s; }
  .btn-primary   { background: #1565c0; color: #fff; }
  .btn-primary:hover { background: #1976d2; }
  .btn-secondary { background: #37474f; color: #e0e0e0; }
  .btn-secondary:hover { background: #546e7a; }
  .btn-green     { background: #2e7d32; color: #fff; }
  .btn-green:hover { background: #388e3c; }
  button:disabled { opacity: .4; cursor: not-allowed; }

  #loading-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 100; align-items: center; justify-content: center; flex-direction: column; gap: 12px; font-size: 1rem; color: #4fc3f7; }
  #loading-overlay.visible { display: flex; }
  .spinner { width: 36px; height: 36px; border: 4px solid #1565c0; border-top-color: #4fc3f7; border-radius: 50%; animation: spin .8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header>
  <h1>WhatsApp → Excel</h1>
  <div id="status-bar">
    <div id="status-dot"></div>
    <span id="status-txt">A carregar modelos…</span>
    <button class="btn-secondary" id="btn-modo-edicao" onclick="toggleModoEdicao()" style="padding:5px 10px; font-size:.8rem; margin-left:12px;" title="Mostra um botão Corrigir em todas as linhas, incluindo as já reconhecidas">✎ Corrigir tudo</button>
    <button class="btn-secondary" onclick="abrirAliases()" style="padding:5px 10px; font-size:.8rem; margin-left:6px;">🏷 Aliases</button>
    <a href="/logout" style="padding:5px 10px; font-size:.8rem; background:#37474f; color:#e0e0e0; border-radius:7px; text-decoration:none; margin-left:6px;">Sair</a>
  </div>
</header>

<div id="settings-modal">
  <div id="settings-box" style="width:560px;">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <h3 style="margin:0;">🏷 Aliases</h3>
      <button class="btn-primary" onclick="abrirCriarAlias()" style="padding:5px 12px; font-size:.82rem;">+ Criar alias novo</button>
    </div>

    <!-- Abas -->
    <div id="alias-tabs" style="display:flex; gap:4px; border-bottom:1px solid #0f3460; margin-bottom:12px;">
      <button class="alias-tab active" data-aba="criados" onclick="trocarAba('criados')">Adicionados</button>
      <button class="alias-tab" data-aba="aprendidos" onclick="trocarAba('aprendidos')">Temporários</button>
    </div>

    <!-- Lista de aliases -->
    <div id="alias-lista" style="max-height:48vh; overflow-y:auto;"></div>

    <!-- Formulário de criação (escondido por defeito) -->
    <div id="alias-criar" style="display:none; border-top:1px solid #0f3460; margin-top:12px; padding-top:12px;">
      <label>Expressão (o que escrevem na encomenda)</label>
      <input id="alias-expressao" type="text" placeholder="ex: recargas drill"
             style="width:100%; padding:8px 12px; background:#0f3460; border:1px solid #1565c0; border-radius:7px; color:#e0e0e0; font-size:.88rem; margin-bottom:10px;">
      <label>Produtos da loja</label>
      <div id="alias-produtos-sel" style="display:flex; flex-wrap:wrap; gap:6px; margin:6px 0;"></div>
      <input id="alias-pesquisa" type="text" placeholder="Pesquisar produto na loja…" autocomplete="off"
             style="width:100%; padding:8px 12px; background:#0f3460; border:1px solid #1565c0; border-radius:7px; color:#e0e0e0; font-size:.88rem;">
      <div id="alias-pesquisa-res" style="max-height:160px; overflow-y:auto; margin-top:4px;"></div>
      <div class="settings-actions">
        <button class="btn-secondary" onclick="cancelarCriarAlias()">Cancelar</button>
        <button class="btn-primary" onclick="guardarAlias()">Guardar alias</button>
      </div>
      <div id="alias-criar-status" style="font-size:.82rem; margin-top:6px;"></div>
    </div>

    <div class="settings-actions" id="alias-fechar-row">
      <button class="btn-secondary" onclick="fecharSettings()">Fechar</button>
    </div>
  </div>
</div>

<main>
  <div id="left">
    <div id="mode-toggle">
      <button id="modo-btn-texto" class="active" onclick="mudarModo('texto')"> Texto</button>
      <button id="modo-btn-imagem" onclick="mudarModo('imagem')">Imagem</button>
    </div>

    <div id="zona-imagem" class="modo-oculto">
      <div id="drop-zone">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4fc3f7" stroke-width="1.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
        <p>Arrasta imagens aqui<br>ou clica para selecionar</p>
        <input type="file" id="file-input" accept="image/*" multiple>
      </div>
      <div id="file-list"></div>
    </div>

    <div id="texto-area">
      <textarea id="texto-input" placeholder="Cola aqui o texto da encomenda…"></textarea>
      <div class="texto-actions">
        <button class="btn-green" id="btn-texto" onclick="processarTexto()">Processar texto</button>
        <button class="btn-secondary" type="button" onclick="limpar()">Limpar</button>
      </div>
    </div>
  </div>

  <div id="right">
    <div id="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Produto</th>
            <th>Qtd</th>
            <th>Score</th>
            <th>Ref.</th>
            <th>Ficheiro</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</main>

<footer>
  <button class="btn-primary" id="btn-export" onclick="exportar()" disabled>Exportar Excel</button>
  <button class="btn-secondary" onclick="limparResultados()">Limpar</button>
  <span id="total-txt" style="margin-left:8px;font-size:.85rem;color:#90caf9;"></span>
</footer>

<div id="loading-overlay">
  <div class="spinner"></div>
  <span id="loading-txt">A processar…</span>
</div>

<script>
let resultados = [];
let modelosReady = false;
let modoEdicao = false;  // quando ligado, todas as linhas (verdes incluídas) mostram "Corrigir"

// Liga/desliga o modo edição e re-renderiza todas as linhas já na tabela.
function toggleModoEdicao() {
  modoEdicao = !modoEdicao;
  const btn = document.getElementById('btn-modo-edicao');
  btn.textContent = modoEdicao ? '✓ A corrigir tudo' : '✎ Corrigir tudo';
  btn.classList.toggle('btn-primary', modoEdicao);
  document.querySelectorAll('#tbody tr').forEach(tr => {
    const row = tr._row;
    if (!row) return;
    if (row.produto) renderIdentificada(tr, row);
    else renderNaoIdentificada(tr, row);
  });
}

// ── Linhas não-identificadas (render + correção) ──────────────────
function renderNaoIdentificada(tr, row) {
  tr._row = row;
  const texto = (row.texto_origem || '').replace(/^linha \d+:\s*/, '').trim();
  const rotulo = row.inexistente
    ? `<span style="color:#ef9a9a;">⚠ Não existe na loja</span>`
    : `<span style="color:#9e9e9e;font-style:italic;">— não identificado —</span>`;
  tr.innerHTML =
    `<td colspan="4">${rotulo}` +
    (texto ? ` <span style="color:#607d8b;">(${texto})</span>` : '') + `</td>` +
    `<td><button class="btn-corrigir" type="button">Corrigir</button></td>`;
  tr.querySelector('.btn-corrigir').onclick = () => abrirCorrecao(tr, texto, row);
}

function renderIdentificada(tr, row) {
  tr._row = row;
  const cls = row.score >= 0.95 ? 'score-high' : row.score >= 0.85 ? 'score-mid' : 'score-low';
  const acao = modoEdicao
    ? `<button class="btn-corrigir" type="button">Corrigir</button>`
    : `<span style="color:#90caf9">${row.ficheiro || ''}</span>`;
  tr.innerHTML =
    `<td>${row.produto}</td>` +
    `<td class="qtd-cell" contenteditable="true" title="Clica para editar a quantidade">${row.qtd}</td>` +
    `<td class="${cls}">${row.score}</td>` +
    `<td>${row.ref || ''}</td><td>${acao}</td>`;
  if (modoEdicao) {
    const texto = (row.texto_origem || row.produto || '').replace(/^linha \d+:\s*/, '').trim();
    tr.querySelector('.btn-corrigir').onclick = () => abrirCorrecao(tr, texto, row);
  }
  const cel = tr.querySelector('.qtd-cell');
  const aplicar = () => {
    const n = parseInt(cel.textContent.replace(/\D/g, ''), 10);
    row.qtd = (n && n > 0) ? n : 1;
    cel.textContent = row.qtd;
  };
  cel.onblur = aplicar;
  cel.onkeydown = (e) => {
    if (e.key === 'Enter') { e.preventDefault(); cel.blur(); }
  };
}

function abrirCorrecao(tr, texto, row) {
  // Reconstrói a linha inteira como uma única célula de edição. Agnóstico à origem:
  // serve tanto para linhas não-identificadas (1 td + botão) como para linhas
  // verdes (5 td), evitando layouts partidos ao entrar em correção.
  tr.innerHTML = `<td colspan="5"></td>`;
  const td = tr.querySelector('td');
  td.style.position = 'relative';
  const qtdInicial = (row.qtd && parseInt(row.qtd, 10) > 0) ? parseInt(row.qtd, 10) : 1;
  td.innerHTML =
    `<div class="corr-box">` +
    `<input class="corr-search" type="text" placeholder="Procurar produto na loja…" value="${texto.replace(/"/g,'&quot;')}">` +
    `<button class="btn-corrigir btn-inexistente" type="button" title="Marcar que este produto não existe na loja">Não existe na loja</button>` +
    `<button class="btn-corrigir btn-cancelar" type="button">✕</button>` +
    `</div><div class="corr-list" style="display:none;"></div>` +
    `<div class="corr-confirm" style="display:none;"></div>`;
  const input = td.querySelector('.corr-search');
  const lista = td.querySelector('.corr-list');
  const confirmar = td.querySelector('.corr-confirm');
  let timer = null, seq = 0;

  function selecionar(produto, ref) {
    lista.style.display = 'none';
    confirmar.style.display = 'flex';
    confirmar.innerHTML =
      `<span class="corr-prod">${produto} <span class="ref">${ref || ''}</span></span>` +
      `<label class="corr-qtd-lbl">Qtd <input class="corr-qtd" type="number" min="1" value="${qtdInicial}"></label>` +
      `<button class="btn-green btn-confirmar" type="button">Confirmar</button>` +
      `<button class="btn-corrigir btn-voltar" type="button">Voltar</button>`;
    const inpQtd = confirmar.querySelector('.corr-qtd');
    confirmar.querySelector('.btn-confirmar').onclick = () => {
      const q = parseInt(inpQtd.value, 10);
      gravarCorrecao(tr, texto, produto, ref, (q && q > 0) ? q : 1, row);
    };
    confirmar.querySelector('.btn-voltar').onclick = () => {
      confirmar.style.display = 'none';
      lista.style.display = 'block';
      input.focus();
    };
    inpQtd.focus();
    inpQtd.onkeydown = (e) => { if (e.key === 'Enter') confirmar.querySelector('.btn-confirmar').click(); };
  }

  async function pesquisar() {
    const q = input.value.trim();
    const meu = ++seq;
    confirmar.style.display = 'none';
    lista.style.display = 'block';
    lista.innerHTML = `<div style="color:#9e9e9e;cursor:default;">A procurar na loja…</div>`;
    try {
      const r = await fetch('/pesquisar_produto?q=' + encodeURIComponent(q));
      const d = await r.json();
      if (meu !== seq) return;  // resposta antiga, ignora
      const hits = d.produtos || [];
      lista.innerHTML = hits.map(p =>
        `<div data-prod="${p.produto.replace(/"/g,'&quot;')}" data-ref="${(p.ref||'').replace(/"/g,'&quot;')}">` +
        `${p.produto} <span class="ref">${p.ref || ''}</span></div>`
      ).join('') || `<div style="color:#9e9e9e;cursor:default;">Sem resultados na loja</div>`;
      lista.querySelectorAll('div[data-prod]').forEach(el => {
        el.onclick = () => selecionar(el.dataset.prod, el.dataset.ref);
      });
    } catch (e) {
      if (meu === seq) lista.innerHTML = `<div style="color:#ef9a9a;cursor:default;">Erro na pesquisa</div>`;
    }
  }
  function agendar() { clearTimeout(timer); timer = setTimeout(pesquisar, 300); }

  input.oninput = agendar;
  input.onfocus = pesquisar;
  td.querySelector('.btn-cancelar').onclick = () => renderNaoIdentificada(tr, row);
  td.querySelector('.btn-inexistente').onclick = () => marcarInexistente(tr, texto, row);
  input.focus();
  pesquisar();
}

async function marcarInexistente(tr, texto, row) {
  try {
    const r = await fetch('/aprender_alias', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto, produto: '__INEXISTENTE__' })
    });
    const d = await r.json();
    if (!d.ok) { alert('Erro: ' + (d.erro || 'desconhecido')); return; }
    row.inexistente = true;
    renderNaoIdentificada(tr, row);
  } catch (e) {
    alert('Falha ao marcar: ' + e);
  }
}

async function gravarCorrecao(tr, texto, produto, ref, qtd, row) {
  try {
    const r = await fetch('/aprender_alias', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto, produto, ref })
    });
    const d = await r.json();
    if (!d.ok) { alert('Erro: ' + (d.erro || 'desconhecido')); return; }
    // Atualiza a linha para o produto escolhido e o resultado em memória.
    // A quantidade vem do campo confirmado (vale só para esta linha / Excel).
    row.produto = d.produto; row.ref = d.ref; row.score = 1;
    row.qtd = (qtd && qtd > 0) ? qtd : 1;
    row.inexistente = false;
    renderIdentificada(tr, row);
    const identificados = resultados.filter(x => x.produto).length;
    document.getElementById('total-txt').textContent = `${identificados} produto(s) identificado(s)`;
    document.getElementById('btn-export').disabled = identificados === 0;
  } catch (e) {
    alert('Falha ao gravar correção: ' + e);
  }
}

// ── Status polling ────────────────────────────────────────────
function pollStatus() {
  fetch('/status').then(r => r.json()).then(d => {
    if (d.ready) {
      modelosReady = true;
      document.getElementById('status-dot').classList.add('ready');
      document.getElementById('status-txt').textContent = 'Pronto';
    } else {
      setTimeout(pollStatus, 1500);
    }
  }).catch(() => setTimeout(pollStatus, 2000));
}
pollStatus();

// ── Drag & drop ───────────────────────────────────────────────
const zone = document.getElementById('drop-zone');
const fileInput = document.getElementById('file-input');

zone.addEventListener('click', () => fileInput.click());
zone.addEventListener('dragover', e => { e.preventDefault(); zone.classList.add('drag-over'); });
zone.addEventListener('dragleave', () => zone.classList.remove('drag-over'));
zone.addEventListener('drop', e => {
  e.preventDefault();
  zone.classList.remove('drag-over');
  const files = [...e.dataTransfer.files].filter(f => f.type.startsWith('image/'));
  if (files.length) processarFicheiros(files);
});
fileInput.addEventListener('change', () => {
  if (fileInput.files.length) processarFicheiros([...fileInput.files]);
  fileInput.value = '';
});

// ── Alternar modo texto/imagem ────────────────────────────────
function mudarModo(modo) {
  const ehTexto = modo === 'texto';
  document.getElementById('texto-area').classList.toggle('modo-oculto', !ehTexto);
  document.getElementById('zona-imagem').classList.toggle('modo-oculto', ehTexto);
  document.getElementById('modo-btn-texto').classList.toggle('active', ehTexto);
  document.getElementById('modo-btn-imagem').classList.toggle('active', !ehTexto);
  if (ehTexto) document.getElementById('texto-input').focus();
}

// ── Processar imagens ────────────────────────────────────────
async function processarFicheiros(files) {
  if (!modelosReady) { alert('Aguarda — modelos ainda a carregar.'); return; }
  mostrarLoading('A processar imagens…');
  const fd = new FormData();
  files.forEach(f => fd.append('imagens', f));
  adicionarFicheiros(files, 'loading');
  try {
    const r = await fetch('/processar', { method: 'POST', body: fd });
    const data = await r.json();
    if (r.ok) {
      adicionarFicheiros(files, 'ok');
      adicionarResultados(data);
    } else {
      adicionarFicheiros(files, 'error');
      alert(data.error || 'Erro ao processar.');
    }
  } catch(e) {
    adicionarFicheiros(files, 'error');
    alert('Erro de ligação ao servidor.');
  }
  esconderLoading();
}

// ── Processar texto ──────────────────────────────────────────
async function processarTexto() {
  if (!modelosReady) { alert('Aguarda — modelos ainda a carregar.'); return; }
  const texto = document.getElementById('texto-input').value.trim();
  if (!texto) return;
  limparResultados();
  mostrarLoading('A processar texto…');
  try {
    const r = await fetch('/processar_texto', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ texto })
    });
    const data = await r.json();
    if (r.ok) adicionarResultados(data);
    else alert(data.error || 'Erro.');
  } catch(e) { alert('Erro de ligação.'); }
  esconderLoading();
}

// ── Exportar ──────────────────────────────────────────────────
async function exportar() {
  if (!resultados.length) return;
  mostrarLoading('A gerar Excel…');
  try {
    const r = await fetch('/exportar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(resultados)
    });
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'resultados.xlsx'; a.click();
    URL.revokeObjectURL(url);
  } catch(e) { alert('Erro ao exportar.'); }
  esconderLoading();
}

// ── UI helpers ────────────────────────────────────────────────
function adicionarFicheiros(files, estado) {
  const list = document.getElementById('file-list');
  const icons = { loading: '⧗', ok: '✓', error: '✕' };
  const colors = { loading: '#ffa726', ok: '#66bb6a', error: '#ef5350' };
  files.forEach(f => {
    const existing = list.querySelector(`[data-name="${CSS.escape(f.name)}"]`);
    if (existing) { existing.querySelector('.icon').textContent = icons[estado]; existing.style.color = colors[estado]; return; }
    const div = document.createElement('div');
    div.className = 'file-item';
    div.dataset.name = f.name;
    div.style.color = colors[estado];
    div.innerHTML = `<span class="icon">${icons[estado]}</span><span>${f.name.slice(0,32)}</span>`;
    list.appendChild(div);
  });
}

function adicionarResultados(data) {
  resultados.push(...data);
  const tbody = document.getElementById('tbody');
  data.forEach(row => {
    const tr = document.createElement('tr');
    if (!row.produto) {
      renderNaoIdentificada(tr, row);
    } else {
      renderIdentificada(tr, row);
    }
    tbody.appendChild(tr);
  });
  const identificados = resultados.filter(r => r.produto).length;
  document.getElementById('total-txt').textContent = `${identificados} produto(s) identificado(s)`;
  document.getElementById('btn-export').disabled = identificados === 0;
}

function limparResultados() {
  resultados = [];
  document.getElementById('tbody').innerHTML = '';
  document.getElementById('total-txt').textContent = '';
  document.getElementById('btn-export').disabled = true;
}

function limpar() {
  limparResultados();
  document.getElementById('texto-input').value = '';
  document.getElementById('file-input').value = '';
  document.getElementById('drop-zone').classList.remove('drag-over');
  document.getElementById('file-list').innerHTML = '';
}

function mostrarLoading(txt) {
  document.getElementById('loading-txt').textContent = txt;
  document.getElementById('loading-overlay').classList.add('visible');
}
function esconderLoading() {
  document.getElementById('loading-overlay').classList.remove('visible');
}

// ── Aliases ────────────────────────────────────────────────────
let _aliasDados = { criados: {}, aprendidos: {} };
let _abaAtual = 'criados';
let _aliasSelecionados = [];   // produtos escolhidos no formulário de criação
let _aliasTimer = null;

async function abrirAliases() {
  document.getElementById('settings-modal').classList.add('visible');
  cancelarCriarAlias();
  await carregarAliases();
}

function fecharSettings() {
  document.getElementById('settings-modal').classList.remove('visible');
}

async function carregarAliases() {
  try {
    const r = await fetch('/aliases');
    _aliasDados = await r.json();
  } catch (e) { _aliasDados = { criados: {}, aprendidos: {} }; }
  renderAliasLista();
}

function trocarAba(aba) {
  _abaAtual = aba;
  document.querySelectorAll('.alias-tab').forEach(b =>
    b.classList.toggle('active', b.dataset.aba === aba));
  renderAliasLista();
}

function renderAliasLista() {
  const cont = document.getElementById('alias-lista');
  const dados = _aliasDados[_abaAtual] || {};
  const chaves = Object.keys(dados);
  if (!chaves.length) {
    cont.innerHTML = `<div id="alias-vazio">Sem aliases ${_abaAtual === 'criados' ? 'adicionados' : 'temporários'}.</div>`;
    return;
  }
  cont.innerHTML = chaves.map(chave => {
    const a = dados[chave];
    let corpo;
    if (a.inexistente) {
      corpo = `<div class="inexistente">marcado como inexistente</div>`;
    } else {
      corpo = `<div class="prods">` + a.produtos.map(p =>
        `${escapeHtml(p.produto)} <span class="ref">${p.ref || ''}</span>`).join(' · ') + `</div>`;
    }
    return `<div class="alias-item">
      <div><div class="expr">${escapeHtml(chave)}</div>${corpo}</div>
      <button class="alias-del" onclick="apagarAlias('${escapeAttr(chave)}')">Apagar</button>
    </div>`;
  }).join('');
}

async function apagarAlias(chave) {
  if (!confirm(`Apagar o alias "${chave}"?`)) return;
  await fetch('/aliases', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chave, aba: _abaAtual })
  });
  await carregarAliases();
}

// ── Criar alias ────────────────────────────────────────────────
function abrirCriarAlias() {
  _aliasSelecionados = [];
  document.getElementById('alias-expressao').value = '';
  document.getElementById('alias-pesquisa').value = '';
  document.getElementById('alias-pesquisa-res').innerHTML = '';
  document.getElementById('alias-criar-status').textContent = '';
  renderSelecionados();
  document.getElementById('alias-criar').style.display = 'block';
  document.getElementById('alias-lista').style.display = 'none';
  document.getElementById('alias-tabs').style.display = 'none';
  document.getElementById('alias-fechar-row').style.display = 'none';
  document.getElementById('alias-expressao').focus();
}

function cancelarCriarAlias() {
  document.getElementById('alias-criar').style.display = 'none';
  document.getElementById('alias-lista').style.display = 'block';
  document.getElementById('alias-tabs').style.display = 'flex';
  document.getElementById('alias-fechar-row').style.display = 'flex';
}

function renderSelecionados() {
  document.getElementById('alias-produtos-sel').innerHTML = _aliasSelecionados.map((p, i) =>
    `<span class="alias-chip">${escapeHtml(p.produto)}<button onclick="removerSelecionado(${i})">×</button></span>`
  ).join('') || `<span style="color:#546e7a;font-size:.8rem;">Nenhum produto ainda.</span>`;
}

function removerSelecionado(i) { _aliasSelecionados.splice(i, 1); renderSelecionados(); }

document.getElementById('alias-pesquisa').addEventListener('input', function() {
  clearTimeout(_aliasTimer);
  _aliasTimer = setTimeout(() => pesquisarParaAlias(this.value.trim()), 300);
});

async function pesquisarParaAlias(q) {
  const res = document.getElementById('alias-pesquisa-res');
  if (!q) { res.innerHTML = ''; return; }
  res.innerHTML = `<div style="color:#9e9e9e;cursor:default;">A procurar…</div>`;
  try {
    const r = await fetch('/pesquisar_produto?q=' + encodeURIComponent(q));
    const d = await r.json();
    const hits = d.produtos || [];
    res.innerHTML = hits.map(p =>
      `<div data-prod="${escapeAttr(p.produto)}" data-ref="${escapeAttr(p.ref || '')}">${escapeHtml(p.produto)} <span class="ref">${p.ref || ''}</span></div>`
    ).join('') || `<div style="color:#9e9e9e;cursor:default;">Sem resultados</div>`;
    res.querySelectorAll('div[data-prod]').forEach(el => {
      el.onclick = () => {
        if (!_aliasSelecionados.some(p => p.produto === el.dataset.prod)) {
          _aliasSelecionados.push({ produto: el.dataset.prod, ref: el.dataset.ref });
          renderSelecionados();
        }
      };
    });
  } catch (e) { res.innerHTML = `<div style="color:#ef9a9a;">Erro na pesquisa</div>`; }
}

async function guardarAlias() {
  const expressao = document.getElementById('alias-expressao').value.trim();
  const status = document.getElementById('alias-criar-status');
  if (!expressao) { status.textContent = 'Escreve a expressão.'; status.style.color = '#ef5350'; return; }
  if (!_aliasSelecionados.length) { status.textContent = 'Adiciona pelo menos um produto.'; status.style.color = '#ef5350'; return; }
  const r = await fetch('/aliases', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ expressao, produtos: _aliasSelecionados.map(p => p.produto) })
  });
  const d = await r.json();
  if (d.ok) {
    _abaAtual = 'criados';
    document.querySelectorAll('.alias-tab').forEach(b => b.classList.toggle('active', b.dataset.aba === 'criados'));
    cancelarCriarAlias();
    await carregarAliases();
  } else {
    status.textContent = d.erro || 'Erro ao guardar.'; status.style.color = '#ef5350';
  }
}

function escapeHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escapeAttr(s) { return (s || '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

document.getElementById('settings-modal').addEventListener('click', function(e) {
  if (e.target === this) fecharSettings();
});
</script>
</body>
