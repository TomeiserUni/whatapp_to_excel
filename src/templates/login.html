<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar- </title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: #16213e; border: 1px solid #0f3460; border-radius: 12px; padding: 36px; width: 360px; max-width: 90vw; }
  h1 { color: #4fc3f7; font-size: 1.2rem; margin-bottom: 8px; text-align: center; }
  .sub { color: #546e7a; font-size: .82rem; text-align: center; margin-bottom: 28px; }
  label { font-size: .85rem; color: #90caf9; display: block; margin-bottom: 6px; margin-top: 14px; }
  input { width: 100%; padding: 10px 12px; background: #0f3460; border: 1px solid #1565c0; border-radius: 7px; color: #e0e0e0; font-size: .9rem; }
  input:focus { outline: none; border-color: #4fc3f7; }
  button { width: 100%; margin-top: 22px; padding: 11px; background: #1565c0; color: #fff; border: none; border-radius: 7px; cursor: pointer; font-size: .92rem; font-weight: 500; transition: background .15s; }
  button:hover { background: #1976d2; }
  .error { color: #ef5350; font-size: .83rem; margin-top: 14px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>WhatsApp → Excel</h1>
  <p class="sub">Introduz as tuas credenciais para continuar</p>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="POST">
    <label>Utilizador</label>
    <input type="text" name="username" autofocus autocomplete="username">
    <label>Password</label>
    <input type="password" name="password" autocomplete="current-password">
    <button type="submit">Entrar</button>
  </form>
</div>
</body>
</html>
